name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # same-repo PRs are already covered by the push run
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          files=$(find system tests -type f -not -path 'system/vendor/*' -not -path '*/.cache/*' |
            while read -r f; do
              case $f in
                *.sh) echo "$f" ;;
                *) head -n 1 "$f" | grep -qE '^#!.*\b(sh|bash|dash)\b' && echo "$f" ;;
              esac
            done)
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck -x -S warning $files
      - name: node --check
        run: |
          rc=0
          for f in $(git ls-files '*.js'); do node --check "$f" || rc=1; done
          exit $rc
      - name: services load
        run: node -e "require('./app/main/services/mock.js'); require('./app/main/services/real.js')"
      - name: json / python syntax
        run: |
          for f in $(git ls-files '*.json'); do python3 -m json.tool "$f" >/dev/null || { echo "bad json: $f"; exit 1; }; done
          git ls-files -z 'tests/*.py' | xargs -0 python3 -m py_compile
      - name: dpi-stand compose config
        run: docker compose -f tests/dpi-stand/compose.yaml config -q

  strategies:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fetch zapret2 release
        run: |
          v=$(sed -n 's/^VERSION=//p' system/fetch-zapret2.sh)
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/zapret2.tar.gz" \
            "https://github.com/bol-van/zapret2/releases/download/$v/zapret2-$v.tar.gz"
      - run: tests/strategies/run.sh
        env:
          ZAPRET2_TARBALL: ${{ runner.temp }}/zapret2.tar.gz

  system-unit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fetch zapret2 -> system/vendor
        run: |
          v=$(sed -n 's/^VERSION=//p' system/fetch-zapret2.sh)
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/zapret2.tar.gz" \
            "https://github.com/bol-van/zapret2/releases/download/$v/zapret2-$v.tar.gz"
          sh system/fetch-zapret2.sh "$RUNNER_TEMP/zapret2.tar.gz"
      # non-privileged: nft/systemctl are stubbed by the tests themselves
      - name: unit, simulate, bootstrap (ubuntu:24.04, no privileges)
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 sh -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends \
              nodejs kmod iproute2 procps ca-certificates curl >/dev/null || exit 2
            rc=0
            sh /src/system/test/unit-tests.sh || rc=1
            sh /src/system/test/simulate-tests.sh || rc=1
            node /src/system/test/bootstrap-test.js /src || rc=1
            exit $rc'

  screenshots:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      # Ubuntu 24.04 AppArmor forbids unprivileged user namespaces -> Chromium sandbox aborts
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: screenshots (mock, xvfb)
        working-directory: app
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          rm -f ../docs/screenshots/*.png
          YTU_HEADLESS=1 xvfb-run -a npm run screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots-linux
          path: docs/screenshots/*.png
          retention-days: 14
          if-no-files-found: warn

  appimage:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/appimage.yml
    with:
      retention-days: 3
