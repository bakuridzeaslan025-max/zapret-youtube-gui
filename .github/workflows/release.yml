name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
          echo "version=$v" >>"$GITHUB_OUTPUT"

  heavy:
    uses: ./.github/workflows/heavy.yml

  appimage:
    needs: [version, heavy]
    uses: ./.github/workflows/appimage.yml
    with:
      version: ${{ needs.version.outputs.version }}
      arm64: true
      retention-days: 30

  release:
    needs: [version, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: appimage-*
          path: out
          merge-multiple: true
      - name: add unversioned copies
        working-directory: out
        run: |
          for f in *.AppImage; do
            cp -- "$f" "$(echo "$f" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-/-/')"
          done
      - name: sha256
        working-directory: out
        run: sha256sum -- *.AppImage | tee SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pre=
          case $VERSION in *-*) pre=--prerelease ;; esac
          # re-run safe: an existing release only gets its assets replaced
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber out/*.AppImage out/SHA256SUMS
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
              --title "$GITHUB_REF_NAME" --generate-notes out/*.AppImage out/SHA256SUMS
          fi
